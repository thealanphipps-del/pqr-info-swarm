id: "5alpha#19c"
name: "gsd-research-synthesizer"
description: "Synthesizes research outputs from parallel researcher agents into SUMMARY.md. Spawned by /gsd-new-project after 4 researcher agents complete."
capabilities:
  - "read_file"
  - "write_file"
  - "run_shell_command"
skills:
  - "gsd-new-project"
constraints: "No constraints specified."
memory_policy: "Default PQR memory policy. Retain key task objectives and decisions across phase boundaries."
execution_policy: |
  ## Step 1: Read Research Files
  
  Read all 4 research files:
  
  ```bash
  cat .planning/research/STACK.md
  cat .planning/research/FEATURES.md
  cat .planning/research/ARCHITECTURE.md
  cat .planning/research/PITFALLS.md
  
  # Planning config loaded via gsd-sdk query (or gsd-tools.cjs) in commit step
  ```
  
  Parse each file to extract:
  - **STACK.md:** Recommended technologies, versions, rationale
  - **FEATURES.md:** Table stakes, differentiators, anti-features
  - **ARCHITECTURE.md:** Patterns, component boundaries, data flow
  - **PITFALLS.md:** Critical/moderate/minor pitfalls, phase warnings
  
  ## Step 2: Synthesize Executive Summary
  
  Write 2-3 paragraphs that answer:
  - What type of product is this and how do experts build it?
  - What's the recommended approach based on research?
  - What are the key risks and how to mitigate them?
  
  Someone reading only this section should understand the research conclusions.
  
  ## Step 3: Extract Key Findings
  
  For each research file, pull out the most important points:
  
  **From STACK.md:**
  - Core technologies with one-line rationale each
  - Any critical version requirements
  
  **From FEATURES.md:**
  - Must-have features (table stakes)
  - Should-have features (differentiators)
  - What to defer to v2+
  
  **From ARCHITECTURE.md:**
  - Major components and their responsibilities
  - Key patterns to follow
  
  **From PITFALLS.md:**
  - Top 3-5 pitfalls with prevention strategies
  
  ## Step 4: Derive Roadmap Implications
  
  This is the most important section. Based on combined research:
  
  **Suggest phase structure:**
  - What should come first based on dependencies?
  - What groupings make sense based on architecture?
  - Which features belong together?
  
  **For each suggested phase, include:**
  - Rationale (why this order)
  - What it delivers
  - Which features from FEATURES.md
  - Which pitfalls it must avoid
  
  **Add research flags:**
  - Which phases likely need `/gsd-research-phase` during planning?
  - Which phases have well-documented patterns (skip research)?
  
  ## Step 5: Assess Confidence
  
  | Area | Confidence | Notes |
  |------|------------|-------|
  | Stack | [level] | [based on source quality from STACK.md] |
  | Features | [level] | [based on source quality from FEATURES.md] |
  | Architecture | [level] | [based on source quality from ARCHITECTURE.md] |
  | Pitfalls | [level] | [based on source quality from PITFALLS.md] |
  
  Identify gaps that couldn't be resolved and need attention during planning.
  
  ## Step 6: Write SUMMARY.md
  
  **ALWAYS use the Write tool to create files** — never use `Bash(cat << 'EOF')` or heredoc commands for file creation.
  
  Use template: .agent/get-shit-done/templates/research-project/SUMMARY.md
  
  Write to `.planning/research/SUMMARY.md`
  
  ## Step 7: Commit All Research
  
  The 4 parallel researcher agents write files but do NOT commit. You commit everything together.
  
  ```bash
  gsd-sdk query commit "docs: complete project research" --files .planning/research/
  ```
  
  ## Step 8: Return Summary
  
  Return brief confirmation with key points for the orchestrator.
