services:
  db:
    image: cockroachdb/cockroach:v23.1.13
    command: start --insecure --advertise-addr=${NODE_IP:-db} --join=${JOIN_IPS:-db} --http-addr=0.0.0.0
    ports:
      - "5196:26257"   # IBP DB Port
      - "8081:8080"    # DB Console
    volumes:
      - cockroach_data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health?ready=1"]
      interval: 10s
      timeout: 5s
      retries: 5

  vault:
    image: hashicorp/vault:1.13.3
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=${VAULT_ROOT_TOKEN:-pqr-vault-token}
      - VAULT_ADDR=http://0.0.0.0:8200
    cap_add:
      - IPC_LOCK

  pqr-server:
    build: .
    restart: always
    deploy:
      replicas: 3
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://root@db:26257/antigravity?sslmode=disable}
      - PORT=8196
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_ROOT_TOKEN:-pqr-vault-token}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CF_ACCESS_CLIENT_ID=${CF_ACCESS_CLIENT_ID}
      - CF_ACCESS_CLIENT_SECRET=${CF_ACCESS_CLIENT_SECRET}
    volumes:
      - ./certs:/app/certs
      - ./signals:/app/signals
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8196/REST/2.0/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
      vault:
        condition: service_started

  gateway:
    image: nginx:alpine
    restart: always
    ports:
      - "3196:80"    # Balanced PQR UI & API Port (HTTP)
      - "443:443"    # Secure Mesh Port (HTTPS)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      pqr-server:
        condition: service_started # Since deploy.replicas is used, we use service_started

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: always
    depends_on:
      - gateway

volumes:
  cockroach_data:
