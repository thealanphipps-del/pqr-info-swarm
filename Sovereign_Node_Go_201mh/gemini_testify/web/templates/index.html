<!DOCTYPE html>
<html>
<head>
    <title>Gemini_Testify | Peer_Comparison_HUD</title>
    <style>
        body { background: #000; color: #32cd32; font-family: monospace; margin: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .pane { border: 1px solid #32cd32; height: 500px; overflow-y: scroll; padding: 10px; background: #050505; }
        h3 { border-bottom: 1px solid #32cd32; padding-bottom: 5px; color: #fff; }
        .meta { margin-bottom: 20px; color: #888; }
        .alert { color: #ff0000; font-weight: bold; }
    </style>
</head>
<body>
    <h1>[MASTER_HUD] Node: {{.UUID}}</h1>
    <div class="meta">Status: {{.Status}} | Vitality: {{.Vitality}} | Case: 0176811576</div>
    
    <div class="grid">
        <div class="pane">
            <h3>MASTERER_FORENSIC_STREAM</h3>
            <div id="master_log"></div>
        </div>
        <div class="pane">
            <h3>RTGO_CO_AUTHOR_NOTES</h3>
            <div id="rtgo_log"></div>
        </div>
    </div>

    <script>
        const masterDiv = document.getElementById('master_log');
        const rtgoDiv = document.getElementById('rtgo_log');
        const socket = new WebSocket('ws://' + window.location.host + '/ws');
        
        socket.onmessage = function(event) {
            const entry = document.createElement('div');
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${event.data}`;
            
            if (event.data.includes('[Rtgo]')) {
                rtgoDiv.prepend(entry);
                if (navigator.vibrate) navigator.vibrate(100);
            } else {
                masterDiv.prepend(entry);
            }
        };
    </script>
</body>
</html>
