<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Gemma IDE</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e1e; color: #d4d4d4; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 350px; background-color: #252526; border-right: 1px solid #3c3c3c; display: flex; flex-direction: column; }
        #main { flex-grow: 1; display: flex; flex-direction: column; min-width: 0; }
        #editor-container { flex-grow: 1; min-height: 0; }
        #terminal-container { height: 250px; background-color: #000; border-top: 1px solid #3c3c3c; }
        
        .header { padding: 15px; font-weight: bold; background-color: #333333; border-bottom: 1px solid #3c3c3c; display: flex; justify-content: space-between; align-items: center;}
        .chat-area { flex-grow: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 8px 12px; border-radius: 5px; max-width: 85%; word-wrap: break-word; font-size: 14px; }
        .user-msg { background-color: #0e639c; align-self: flex-end; }
        .ai-msg { background-color: #3c3c3c; align-self: flex-start; border-left: 3px solid #f29c1f; }
        
        .input-area { padding: 10px; background-color: #252526; border-top: 1px solid #3c3c3c; }
        .input-box { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #3c3c3c; background-color: #3c3c3c; color: white; border-radius: 3px; resize: none; font-family: inherit; }
        .controls { display: flex; flex-direction: column; gap: 5px; margin-top: 5px; }
        .control-row { display: flex; justify-content: space-between; align-items: center; }
        select { background-color: #3c3c3c; color: white; border: 1px solid #3c3c3c; padding: 4px; border-radius: 3px; font-size: 12px; }
        button { background-color: #0e639c; color: white; border: none; padding: 6px 12px; border-radius: 3px; cursor: pointer; font-size: 12px; }
        button:hover { background-color: #1177bb; }
        label { font-size: 11px; color: #aaa; }
    </style>
    <!-- Monaco Editor -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
    <!-- Xterm.js -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@4.19.0/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@4.19.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.5.0/lib/xterm-addon-fit.js"></script>
</head>
<body>

<div id="sidebar">
    <div class="header">
        <span>Gemma Local AI</span>
        <select id="provider-select">
            <option value="LM_STUDIO">LM Studio</option>
            <option value="DIRECT">Direct (Local)</option>
        </select>
    </div>
    <div class="chat-area" id="chat-history">
        <div class="message ai-msg">Sovereign Gemma IDE initialized. Type /help for commands. Autocomplete active in editor.</div>
    </div>
    <div class="input-area">
        <textarea class="input-box" id="prompt-input" rows="3" placeholder="Ask Gemma or use /tasks, @workspace..."></textarea>
        <div class="controls">
            <div class="control-row">
                <label>Model:</label>
                <select id="model-select"></select>
            </div>
            <div class="control-row">
                <span></span>
                <button onclick="sendPrompt()">Send</button>
                <button onclick="suggestParagraph()">Suggest</button>
            </div>
        </div>
    </div>
</div>

<div id="main">
    <div id="editor-container"></div>
    <div id="terminal-container"></div>
</div>

<script>
    let editor;

    // --- Monaco Initialization ---
    require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' } });
    require(['vs/editor/editor.main'], function () {
        editor = monaco.editor.create(document.getElementById('editor-container'), {
            value: [
                'package main',
                '',
                'import "fmt"',
                '',
                'func main() {',
                '\tfmt.Println("Hello Sovereign Mesh")',
                '\t// Try typing "/" for mesh commands',
                '}'
            ].join('\n'),
            language: 'go',
            theme: 'vs-dark',
            automaticLayout: true,
            suggestOnTriggerCharacters: true
        });

        // Register Completion Provider
        monaco.languages.registerCompletionItemProvider('go', {
            triggerCharacters: ['/', '.', '(', '&'],
            provideCompletionItems: async function (model, position) {
                const textUntilPosition = model.getValueInRange({
                    startLineNumber: position.lineNumber,
                    startColumn: 1,
                    endLineNumber: position.lineNumber,
                    endColumn: position.column
                });
                
                const lastChar = textUntilPosition.slice(-1);
                const prefix = textUntilPosition.split(/\s+/).pop();

                const response = await fetch('/api/complete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: model.getValue(), position, prefix })
                });
                const data = await response.json();

                const suggestions = data.suggestions.map(s => ({
                    label: s.label,
                    kind: monaco.languages.CompletionItemKind[s.kind],
                    documentation: s.detail,
                    insertText: s.insertText,
                    insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                    range: {
                        startLineNumber: position.lineNumber,
                        endLineNumber: position.lineNumber,
                        startColumn: position.column - (lastChar === '/' ? 0 : prefix.length),
                        endColumn: position.column
                    }
                }));

                return { suggestions: suggestions };
            }
        });
    });

    // --- Model Loading ---
    fetch('/api/models')
        .then(res => res.json())
        .then(data => {
            const select = document.getElementById('model-select');
            data.models.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m;
                opt.textContent = m;
                select.appendChild(opt);
            });
        });

    // --- Chat Logic ---
    function appendMessage(text, isUser) {
        const chat = document.getElementById('chat-history');
        const div = document.createElement('div');
        div.className = `message ${isUser ? 'user-msg' : 'ai-msg'}`;
        div.innerText = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    async function sendPrompt() {
        const input = document.getElementById('prompt-input');
        const prompt = input.value.trim();
        const model = document.getElementById('model-select').value;
        const provider = document.getElementById('provider-select').value;
        if (!prompt) return;

        appendMessage(prompt, true);
        input.value = '';

        const res = await fetch('/api/infer', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                prompt, 
                model, 
                provider,
                context: prompt.includes('@workspace') ? "@workspace" : "" 
            })
        });
        const data = await res.json();
        appendMessage(data.text, false);
    }
    async function suggestParagraph() {
        const prompt = document.getElementById('prompt-input').value.trim();
        const model = document.getElementById('model-select').value;
        const provider = document.getElementById('provider-select').value;
        if (!prompt) return;
        const res = await fetch('/api/suggest', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt, model, provider })
        });
        const data = await res.json();
        if (editor) {
            const position = editor.getPosition();
            editor.executeEdits('', [{ range: new monaco.Range(position.lineNumber, position.column, position.lineNumber, position.column), text: data.suggestion }]);
        }
        appendMessage(data.suggestion, false);
    }

    document.getElementById('prompt-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendPrompt();
        }
    });

    // --- Terminal Initialization ---
    const term = new Terminal({ theme: { background: '#000000' }, fontSize: 12 });
    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminal-container'));
    fitAddon.fit();

    const ws = new WebSocket(`ws://${window.location.host}/terminal`);
    ws.onmessage = (event) => { term.write(event.data); };
    term.onData((data) => { ws.send(data); });
    
    window.addEventListener('resize', () => { fitAddon.fit(); });
</script>

</body>
</html>
